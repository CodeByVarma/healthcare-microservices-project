# =========================

# RESILIENCE4J CIRCUIT BREAKER

# =========================

resilience4j.circuitbreaker.instances.notificationService.registerHealthIndicator=true

resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=5

resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50

resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.notificationService.ignore-exceptions[0]=com.healthcare.appointmentservice.exception.SlotAlreadyBookedException

resilience4j.circuitbreaker.instances.notificationService.ignore-exceptions[1]=com.healthcare.appointmentservice.exception.ResourceNotFoundException

# =========================

# RESILIENCE4J RETRY

# =========================

resilience4j.retry.instances.notificationService.max-attempts=3

resilience4j.retry.instances.notificationService.wait-duration=2s

resilience4j.retry.instances.notificationService.ignore-exceptions[0]=com.healthcare.appointmentservice.exception.SlotAlreadyBookedException

resilience4j.retry.instances.notificationService.ignore-exceptions[1]=com.healthcare.appointmentservice.exception.ResourceNotFoundException



